[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cycling-view-backend"
version = "0.1.0"
description = "FastAPI backend for the Strava cycling viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "fitdecode>=0.10",
    "lxml>=5.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "lttb>=0.3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
